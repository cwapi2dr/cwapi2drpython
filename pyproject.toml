[project]
name = "cwapi2dr"
version = "0.0.1"

authors = [{ name = "Cadwork", email = "it@cadwork.ca" }]
requires-python = ">= 3.14"
description = 'Python bindings for CwAPI2DR'
readme = "README.md"
license-files = [ "LICENSE" ]
keywords = [ "cadwork" ]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/cwapi2dr/cwapi2drpython"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/cwapi2dr",
]

[tool.hatch.build]
include = [
    "*.pyi",
    "py.typed",
]
exclude = [
    "*.py",
]
